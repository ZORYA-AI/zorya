    this._onAnchor = (e) => {
      const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      const h = a.getAttribute('href');
      if (!h || h === '#' || h.indexOf('#/') === 0) return;
      const id = h.slice(1);
      const el = id === 'top' ? document.body : document.getElementById(id);
      if (!el) return;
      e.preventDefault();
      const scroller = document.body.scrollHeight > document.body.clientHeight + 2 ? document.body : document.documentElement;
      const current = scroller.scrollTop || window.scrollY;
      const top = el.getBoundingClientRect().top + current - 86;
      if (scroller.scrollTo) scroller.scrollTo({ top, behavior: 'smooth' });
      else scroller.scrollTop = top;
      if (history.replaceState) history.replaceState(null, '', h);
    };
    document.addEventListener('click', this._onAnchor);
    this._onRoute = (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
      const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      const href = a.getAttribute('href') || '';
      if (!/^\/[a-z-]*$/.test(href)) return;
      const seg = href.replace(/^\//, '').replace(/\/+$/, '');
      const r = this.slugMap()[seg];
      if (!r) return;
      if (window.__ZR) { const ts = a.getAttribute('data-then-scroll'); if (ts) { e.preventDefault(); window.location.href = href + '#' + ts; } return; }
      e.preventDefault();

      this.goRoute(r, thenScroll);
    };
    document.addEventListener('click', this._onRoute);

  }

  routeSlug(route) {
    return route === 'home' ? '' : (route === 'services' ? 'accelerator' : (route === 'circle' ? 'inner-circle' : (route === 'event' ? 'free-masterclass' : route)));
  }

  syncRoute() {
    const map = this.slugMap();
    const hash = (window.location.hash || '').match(/^#\/([a-z-]+)/);
    let key = null;
    if (hash) key = hash[1];
    else {
      const seg = (window.location.pathname || '').replace(/\/+$/, '').split('/').pop() || '';
      key = seg.replace(/\.html$/, '');
    }
    const r = map[key];
    if (!r) return null;
    this.setState({ route: r });
    return r;
  }

  scrollToTop() {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }

  reloadTally() {
    clearInterval(this._tally);
    let tries = 0;
    this._tally = setInterval(() => {
      if (window.Tally) { window.Tally.loadEmbeds(); clearInterval(this._tally); }
      else if (++tries > 30) clearInterval(this._tally);
    }, 150);
  }

  goRoute(route, thenScrollId) {
    if (window.__ZR) { window.location.href = '/' + this.routeSlug(route) + (thenScrollId ? '#' + thenScrollId : ''); return; }
    const base = (window.location.pathname || '/').replace(/[^/]*$/, '');
    try { window.history.pushState({ route: route }, '', base + this.routeSlug(route)); }
    catch (err) { window.location.href = base + this.routeSlug(route); }
    this.setState({ route: route, menuOpen: false });
    this.reloadTally();
    if (thenScrollId) {
      let tries = 0;
      const scrollToAnchor = () => {
        const el = document.getElementById(thenScrollId);
        if (!el) {
          tries++;
          if (tries < 40) setTimeout(scrollToAnchor, 50);
          return;
        }
        const scroller = document.body.scrollHeight > document.body.clientHeight + 2 ? document.body : document.documentElement;
        const top = el.getBoundingClientRect().top + (scroller.scrollTop || window.scrollY) - 86;
        if (scroller.scrollTo) scroller.scrollTo({ top, behavior: 'smooth' }); else scroller.scrollTop = top;
      };
      this.scrollToTop();
      setTimeout(scrollToAnchor, 120);
      return;
    }
    this.scrollToTop();
    requestAnimationFrame(() => { this.scrollToTop(); requestAnimationFrame(() => this.scrollToTop()); });
    setTimeout(() => this.scrollToTop(), 50);
    setTimeout(() => this.scrollToTop(), 200);
  }

      onCMessage: e => this.setState({ cMessage: e.target.value, cSent: false }),
      cSubmit: () => {
        const subject = encodeURIComponent(`Contact from ${this.state.cName || 'website'} — ${this.state.cReason}`);
        const body = encodeURIComponent(`${this.state.cMessage}\n\nFrom: ${this.state.cName} <${this.state.cEmail}>`);
        window.location.href = `mailto:team@zoryaai.com?subject=${subject}&body=${body}`;
        this.setState({ cSent: true });
      },
      cCtaLabel: this.state.cSent ? 'Sent, we’ll reply within three days' : 'Send message'
    };
  }

  renderVals() {
    const r = this.state.route;
    return {
      ...this.homeVals(),
      ...this.servicesVals(),
      ...this.aboutVals(),
      ...this.contactVals(),
      ...this.circleVals(),
      isHome: r === 'home',
      isWelcome: r === 'welcome', isCheckEmail: r === 'check-email', isConfirmed: r === 'confirmed', wlEmail: this.getWlEmail(), hasWlEmail: !!this.getWlEmail(),
      cities: 'Ljubljana, Slovenia|Maribor, Slovenia|Koper, Slovenia|Kranj, Slovenia|Celje, Slovenia|Novo Mesto, Slovenia|Dublin, Ireland|Cork, Ireland|Galway, Ireland|Limerick, Ireland|Frankfurt, Germany|Berlin, Germany|Munich, Germany|Hamburg, Germany|Cologne, Germany|Stuttgart, Germany|Düsseldorf, Germany|Leipzig, Germany|Barcelona, Spain|Madrid, Spain|Valencia, Spain|Seville, Spain|Bilbao, Spain|Malaga, Spain|Austin, Texas, USA|Houston, Texas, USA|Dallas, Texas, USA|San Antonio, Texas, USA|New York, USA|San Francisco, USA|Los Angeles, USA|Chicago, USA|Boston, USA|Seattle, USA|Miami, USA|Washington, USA|Denver, USA|Atlanta, USA|London, United Kingdom|Manchester, United Kingdom|Edinburgh, United Kingdom|Paris, France|Lyon, France|Amsterdam, Netherlands|Rotterdam, Netherlands|Brussels, Belgium|Zurich, Switzerland|Geneva, Switzerland|Vienna, Austria|Prague, Czechia|Warsaw, Poland|Budapest, Hungary|Zagreb, Croatia|Split, Croatia|Belgrade, Serbia|Sarajevo, Bosnia and Herzegovina|Bucharest, Romania|Sofia, Bulgaria|Athens, Greece|Rome, Italy|Milan, Italy|Lisbon, Portugal|Porto, Portugal|Copenhagen, Denmark|Stockholm, Sweden|Oslo, Norway|Helsinki, Finland|Tallinn, Estonia|Riga, Latvia|Vilnius, Lithuania|Dubai, United Arab Emirates|Tel Aviv, Israel|Istanbul, Turkey|Cairo, Egypt|Lagos, Nigeria|Nairobi, Kenya|Cape Town, South Africa|Mumbai, India|Bangalore, India|Delhi, India|Singapore, Singapore|Hong Kong, China|Tokyo, Japan|Seoul, South Korea|Sydney, Australia|Melbourne, Australia|Auckland, New Zealand|Toronto, Canada|Vancouver, Canada|Montreal, Canada|Mexico City, Mexico|São Paulo, Brazil|Buenos Aires, Argentina|Santiago, Chile|Bogotá, Colombia'.split('|').map(c => ({ c })),
      welcomeDone: !!this.state.welcomeDone, welcomeForm: !this.state.welcomeDone,
      welcomeHasEmail: !!this.getWlEmail(), welcomeNoEmail: !this.getWlEmail(),
      welcomeOther: this.state.welcomeRole === 'Other',
      welcomeRoles: ['Founder', 'Senior leader', 'Investor', 'Educator / researcher', 'Student', 'Other'].map(label => { const on = this.state.welcomeRole === label; return { label, bg: on ? '#14205C' : '#fff', fg: on ? '#FBF9F2' : '#14205C', bd: on ? '#14205C' : 'rgba(20,32,92,0.32)', pick: () => this.setState({ welcomeRole: label }) }; }),
      welcomeStep0: this.state.welcomeStep === undefined || this.state.welcomeStep === 0, welcomeStep1: this.state.welcomeStep === 1, welcomeStep2: this.state.welcomeStep === 2,
      welcomeCount: ((this.state.welcomeStep || 0) + 1) + '/3', welcomePct: Math.round((((this.state.welcomeStep || 0) + 1) / 3) * 100) + '%',
      welcomeName: this.state.welcomeName || '', welcomeCity: this.state.welcomeCity || '', welcomeRoleOther: this.state.welcomeRoleOther || '',
      setName: (e) => this.setState({ welcomeName: e.target.value }), setCity: (e) => this.setState({ welcomeCity: e.target.value }), setRoleOther: (e) => this.setState({ welcomeRoleOther: e.target.value }),
      nextName: (e) => { e.preventDefault(); this.setState({ welcomeName: e.target.elements[0].value, welcomeStep: 1 }); },
      nextCity: (e) => { e.preventDefault(); this.setState({ welcomeCity: e.target.elements[0].value, welcomeStep: 2 }); },
      goBack: () => this.setState(s => ({ welcomeStep: Math.max(0, (s.welcomeStep || 0) - 1) })),
      finishWelcome: (e) => {
        e.preventDefault();
        const f = e.target, email = this.getWlEmail();
        let role = this.state.welcomeRole || '';
        if (role === 'Other') role = (f.querySelector('input[type=text]') && f.querySelector('input[type=text]').value.trim()) || 'Other';
        const payload = { email, firstName: (this.state.welcomeName || '').trim(), location: (this.state.welcomeCity || '').trim(), role, step: 'profile' };
        if (email) fetch('/api/subscribe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) }).catch(() => {});
        this.goRoute('check-email');
      },
      wlSent: this.state.wlSent, wlForm: !this.state.wlSent, wlAskName: this.state.wlSent && !this.state.wlNameDone, wlNameDone: this.state.wlNameDone,
      submitName: (e) => {
        e.preventDefault();
        const firstName = e.target.FIRSTNAME.value.trim();
        if (firstName && this._wlEmail) fetch('/api/subscribe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: this._wlEmail, firstName, step: 'name' }) }).catch(() => {});
        this.setState({ wlNameDone: true });
      },
      wlError: this.state.wlError,
      submitWaitlist: (e) => {
        e.preventDefault();
        const form = e.target, email = (this._wlEmail = form.EMAIL.value), hp = form.email_address_check.value;
        const native = () => { form.submit(); this.afterJoin(email); };
        fetch('/api/subscribe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email, website: hp }) })
          .then((r) => { if (r.ok) this.afterJoin(email); else if (r.status === 404 || r.status === 405) native(); else this.setState({ wlError: true }); })
          .catch(native);
      },
      isServices: r === 'services',
      isAbout: r === 'about',
      isContact: r === 'contact',
      isSlovenija: r === 'slovenija',
      isMissionEurope: r === 'mission-europe',
      isEvent: r === 'event',
      isCircle: r === 'circle',
      navOpen: this.state.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      toPrijava: e => {
        e.preventDefault();
        const el = document.getElementById('prijava');
        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });
      }
    };
  }
}
</script>
</body>
</html>
